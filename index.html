<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartão de Visita Digital NFC</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .action-btn {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .action-btn:active {
            transform: scale(0.96);
        }
    </style>
</head>
<body class="text-slate-100 font-sans antialiased flex flex-col items-center justify-start min-h-screen p-4 sm:p-6">

    <!-- Mobile Screen Wrapper Container -->
    <div class="w-full max-w-md my-auto relative">

        <!-- NFC Tag Wave Indicator Graphic -->
        <div class="flex justify-center mb-3 opacity-80">
            <div class="flex items-center gap-2 px-3 py-1 bg-slate-800/80 rounded-full border border-slate-700/60 text-xs text-slate-300 shadow-inner">
                <i class="fa-solid fa-wifi rotate-90 text-sky-400 animate-pulse"></i>
                <span>Cartão Aproximação NFC</span>
            </div>
        </div>

        <!-- Main Digital Business Card -->
        <div class="glass-card rounded-3xl p-6 shadow-2xl relative overflow-hidden">

            <!-- Decorative Ambient Glows -->
            <div class="absolute -top-10 -left-10 w-32 h-32 bg-sky-500/20 rounded-full blur-2xl pointer-events-none"></div>
            <div class="absolute -bottom-10 -right-10 w-32 h-32 bg-emerald-500/20 rounded-full blur-2xl pointer-events-none"></div>

            <!-- Top Control Bar (Apenas botão de Compartilhar) -->
            <div class="flex justify-end items-center mb-6 relative z-10">
                <button id="btnShare" class="w-9 h-9 flex items-center justify-center rounded-xl bg-slate-800/80 hover:bg-slate-700 border border-slate-700 text-slate-300 transition-all action-btn" title="Compartilhar Cartão">
                    <i class="fa-solid fa-share-nodes"></i>
                </button>
            </div>

            <!-- Profile Info Section -->
            <div class="flex flex-col items-center text-center relative z-10">
                <!-- Avatar / Foto de Perfil -->
                <div class="relative mb-4">
                    <div class="w-28 h-28 rounded-full overflow-hidden border-2 border-sky-400/50 p-1 bg-slate-800 shadow-xl">
                        <img id="cardAvatar" src="image01.png" alt="Foto de Perfil" class="w-full h-full object-cover rounded-full">
                    </div>
                    <span class="absolute bottom-1 right-1 bg-emerald-500 w-4 h-4 rounded-full border-2 border-slate-900 shadow" title="Disponível"></span>
                </div>

                
                <h1 class="text-2xl font-bold tracking-tight text-white mb-0.5">Suyanne Moreira</h1>
                <p class="text-sm font-medium text-sky-400 mb-3">Perfil Profissional | Salão de Beleza</p>
                
               
                <p class="text-xs text-slate-300 max-w-xs leading-relaxed mb-4">
                    Expert em Loiros e Lisos em GERAL 
                </p>
            </div>

            <!-- Action Buttons Grid -->
            <div class="mt-4 space-y-3 relative z-10">


                <a id="linkWhatsapp" href="https://wa.me/message/5W3YDPEZRIZOI1" target="_blank" class="flex items-center justify-between p-3.5 rounded-2xl bg-slate-800/60 hover:bg-slate-700/80 border border-slate-700/60 transition-all action-btn group">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-xl bg-emerald-500/10 text-emerald-400 flex items-center justify-center text-lg group-hover:scale-110 transition-transform">
                            <i class="fa-brands fa-whatsapp"></i>
                        </div>
                        <span class="text-sm font-medium text-slate-200">WhatsApp </span>
                    </div>
                    <i class="fa-solid fa-chevron-right text-xs text-slate-500 group-hover:translate-x-1 transition-transform"></i>
                </a>


                <a id="linkPhone" href="tel:+55 85 99912-3113" class="flex items-center justify-between p-3.5 rounded-2xl bg-slate-800/60 hover:bg-slate-700/80 border border-slate-700/60 transition-all action-btn group">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-xl bg-sky-500/10 text-sky-400 flex items-center justify-center text-lg group-hover:scale-110 transition-transform">
                            <i class="fa-solid fa-phone"></i>
                        </div>
                        <span class="text-sm font-medium text-slate-200">Ligar Agora</span>
                    </div>
                    <i class="fa-solid fa-chevron-right text-xs text-slate-500 group-hover:translate-x-1 transition-transform"></i>
                </a>


                <a id="https://www.instagram.com/suhmoureira_hair/" href="https://instagram.com/suhmoureira_hair" target="_blank" class="flex items-center justify-between p-3.5 rounded-2xl bg-slate-800/60 hover:bg-slate-700/80 border border-slate-700/60 transition-all action-btn group">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-xl bg-pink-500/10 text-pink-400 flex items-center justify-center text-lg group-hover:scale-110 transition-transform">
                            <i class="fa-brands fa-instagram"></i>
                        </div>
                        <span class="text-sm font-medium text-slate-200">Instagram</span>
                    </div>
                    <i class="fa-solid fa-chevron-right text-xs text-slate-500 group-hover:translate-x-1 transition-transform"></i>
                </a>


                <a id="linkLocation" href="https://maps.google.com/?q=Avenida José jathay 1643
Studio Andreza Almeida " target="_blank" class="flex items-center justify-between p-3.5 rounded-2xl bg-slate-800/60 hover:bg-slate-700/80 border border-slate-700/60 transition-all action-btn group">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-xl bg-amber-500/10 text-amber-400 flex items-center justify-center text-lg group-hover:scale-110 transition-transform">
                            <i class="fa-solid fa-location-dot"></i>
                        </div>
                        <span class="text-sm font-medium text-slate-200">Nosso Endereço / Google Maps</span>
                    </div>
                    <i class="fa-solid fa-chevron-right text-xs text-slate-500 group-hover:translate-x-1 transition-transform"></i>
                </a>


                <div class="flex items-center justify-between p-3.5 rounded-2xl bg-slate-800/60 border border-slate-700/60">
                    <div class="flex items-center gap-3 overflow-hidden mr-2">
                        <div class="w-10 h-10 rounded-xl bg-teal-500/10 text-teal-400 flex items-center justify-center text-lg shrink-0">
                            <i class="fa-solid fa-qrcode"></i>
                        </div>
                        <div class="flex flex-col overflow-hidden">
                            <span class="text-xs text-slate-400">Chave Pix</span>

                            <span id="pixKeyText" class="text-xs font-semibold text-slate-200 truncate select-all"> 85999123113</span>
                        </div>
                    </div>
                    <button id="btnCopyPix" class="px-3 py-1.5 bg-teal-500 hover:bg-teal-400 text-slate-950 font-bold text-xs rounded-xl transition-all action-btn shrink-0">
                        Copiar
                    </button>
                </div>

            </div>

            <!-- Card Footer -->
            <div class="mt-8 pt-4 border-t border-slate-800 text-center">
                <p class="text-[11px] text-slate-500">
                    Aproxime seu celular do chaveiro para interagir.
                </p>
            </div>
        </div>
    </div>

    <!-- TOAST NOTIFICATION (Aviso de Copiado) -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-800 text-slate-100 px-4 py-2.5 rounded-2xl border border-slate-700 shadow-xl text-xs flex items-center gap-2 opacity-0 pointer-events-none transition-all duration-300 z-50">
        <i class="fa-solid fa-circle-check text-emerald-400"></i>
        <span id="toastMsg">Texto copiado!</span>
    </div>

    <!-- Scripts de Interação -->
    <script>
        // Função de exibir notificação flutuante
        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            toast.classList.add('opacity-100');
            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2500);
        }

        // Função de Copiar Chave Pix
        document.getElementById('btnCopyPix').addEventListener('click', () => {
            const pixText = document.getElementById('pixKeyText').innerText;
            const dummy = document.createElement('textarea');
            dummy.value = pixText;
            document.body.appendChild(dummy);
            dummy.select();
            document.execCommand('copy');
            document.body.removeChild(dummy);
            showToast("Chave Pix copiada com sucesso!");
        });

        // Botão de Compartilhar Link do Cartão
        document.getElementById('btnShare').addEventListener('click', async () => {
            if (navigator.share) {
                try {
                    await navigator.share({
                        title: 'Cartão Digital',
                        text: 'Confira meu cartão de visita digital:',
                        url: window.location.href
                    });
                } catch (err) { }
            } else {
                const dummy = document.createElement('input');
                document.body.appendChild(dummy);
                dummy.value = window.location.href;
                dummy.select();
                document.execCommand('copy');
                document.body.removeChild(dummy);
                showToast("Link do cartão copiado!");
            }
        });
    </script>
</body>
</html>
